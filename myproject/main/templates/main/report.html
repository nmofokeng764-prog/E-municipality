{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Report an Issue</title>
     <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

       
        nav {
            background-color: #499e2f;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }

        
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
         h1 {
        text-align: 0;
    background-color: #fdfffd;
        color: rgb(12, 12, 12);
        padding: 25px 10px;
        font-size: 0.9rem;
    }

    header {
    background-color: #fdfffd;
    color: white;
    display: flex;             
    align-items: center;       
    justify-content: flex-start;   
    gap: 0px;                  
    padding: 15px 10px;
      height: 50px;
}


       
        label {
            font-weight: bold;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:required,
        select:required,
        textarea:required {
            border-color: #499e2f;
        }

        button {
            background-color: #499e2f;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #a6decc;
        }
        .required {
    color: red;
    font-weight: bold;
}
  header img {
            height: 50px; /* Logo height */
            width: auto;
        }
footer {
    text-align: center;
    padding: 20px;
    background-color: #499e2f;
    color: white;
    position: fixed;
    bottom: 0;
    width: 100%;
        height: 5px;
}

        
        @media (max-width: 650px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            nav {
                flex-direction: column;
                align-items: flex-start;
            }
            nav a {
                margin: 5px 0 0 0;
            }
        }
    </style>
    <link rel="stylesheet" href="{% static 'main/css/report.css' %}">
</head>
<body>
<header>
    <img src="{% static 'main/logo HCI.jpg' %}" alt="Logo">
    <h1>E-Municipality</h1>
   
</header>

    <nav>
       <a href="{% url 'home' %}">Home</a>|
        <a href="/report/">Report Issue</a>|
        <a href="#">View Reports</a>|
        <a href="#">Announcements</a>|
        <a href="{% url 'feedback_home' %}">Contacts</a>
    </nav>

    <hr>
 
      
    <div class="container">
        <h1>Report an Issue</h1>
     

        <form method="POST">
            {% csrf_token %}
<p><span class="required">*</span> indicates required fields</p>
            <label>Full Name <span class="required">*</span></label>
<input type="text" placeholder="Enter your name">

<label>Contact Number <span class="required">*</span></label>
<input type="text" placeholder="Enter your number">

         
           <label>Location <span class="required">*</span></label>
<input type="text" placeholder="Enter location">
            
            <label for="issue_type">Issue Type <span class="required">*</span></label><br>
            <select id="issue_type" name="issue_type" required>
                <option value="">Select an issue</option>
                <option value="water">Water</option>
                <option value="electricity">Electricity</option>
                <option value="waste">Waste Collection</option>
                <option value="drainage">Drainage System</option>
                <option value="roads">Roads</option>
            </select><br><br>

           
          
            <label for="description">More Information</label><br>
            <textarea id="description" name="description" rows="4"></textarea><br><br>

           
            <label for="severity">Urgency / Severity <span class="required">*</span></label><br>
            <select id="severity" name="severity" required>
                <option value="">Select severity</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
            </select><br><br>

            <button type="submit">Submit Report</button>
        </form>
    </div>

    <footer>
    © 2026 Municipality System
</footer>
</body>
</html>
